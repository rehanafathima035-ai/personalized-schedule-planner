# Test profile: H2 in memory, so the API tests need no MySQL server.
spring:
  datasource:
    url: jdbc:h2:mem:planner;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256
  planner:
    base-url: http://localhost:8001
